name: Build and Push Prison Ministry Frontend Docker Image

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read # allows GITHUB_TOKEN to pull @yourorg packages from npm.pkg.github.com

env:
  IMAGE_NAME: myai-admin

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 22.x
          node-auth-token: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Set image tag
        run: |
          echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "MOVING_TAG=production" >> "$GITHUB_ENV"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            myairobotics/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            myairobotics/${{ env.IMAGE_NAME }}:${{ env.MOVING_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max